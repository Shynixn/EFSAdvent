@if (open) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm"
    (click)="close()"
    (keydown)="onKeydown($event)"
    tabindex="-1"
    role="presentation"
  >
    <div
      class="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-800 shadow-2xl"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title"
    >
      <!-- Header -->
      <header class="flex items-center justify-between gap-4 border-b border-slate-700 px-5 py-4">
        <h2 class="text-lg font-semibold text-white">{{ title }}</h2>
        <app-button
          variant="ghost"
          color="slate"
          [iconOnly]="true"
          title="Close dialog"
          [icon]="'M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z'"
          (clicked)="close()"
        />
      </header>

      <!-- Body -->
      <div class="px-5 py-4">
        <ng-content />
      </div>
    </div>
  </div>
}
