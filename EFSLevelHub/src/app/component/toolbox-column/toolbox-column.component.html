<!-- Right column (Toolbox). -->
<aside class="flex h-full w-full flex-col border-l border-slate-800 bg-slate-900/60">
  <h2
    class="shrink-0 border-b border-slate-800 px-4 py-3 text-xs font-semibold uppercase tracking-wide text-slate-400"
  >
    Toolbox
  </h2>

  <div class="min-h-0 flex-1 overflow-y-auto p-4">
    <!-- Advanced (collapsible): manual tile drawing -->
    <div class="rounded-lg border border-slate-800">
      <button
        type="button"
        (click)="toggleAdvanced()"
        class="flex w-full cursor-pointer items-center justify-between px-3 py-2 text-xs font-semibold uppercase tracking-wide text-slate-400"
      >
        <span>Advanced</span>
        <span class="text-slate-500">{{ advancedOpen() ? '▾' : '▸' }}</span>
      </button>
      @if (advancedOpen()) {
        <div class="space-y-3 border-t border-slate-800 px-3 py-3">
          <p class="text-[11px] text-slate-500">
            Manual tile drawing. Pick a tile below, then paint directly onto the room.
          </p>
          <app-tile-palette
            [renderer]="renderer"
            [gba]="gba"
            [tile]="brushTile"
            (tilePicked)="tilePicked.emit($event)"
          />
        </div>
      }
    </div>

    <!-- Decorations (smart objects): drag onto the canvas to place -->
    <div class="mt-3 rounded-lg border border-slate-800">
      <div class="px-3 py-2 text-xs font-semibold uppercase tracking-wide text-slate-400">
        Decorations
      </div>
      <div class="space-y-2 border-t border-slate-800 px-3 py-3">
        <p class="text-[11px] text-slate-500">
          Drag a decoration onto the room canvas to place it. All its tiles are stamped at once.
        </p>
        <div class="flex flex-wrap gap-2">
          @for (decoration of decorations; track decoration.id) {
            <button
              type="button"
              draggable="true"
              (dragstart)="onDecorationDragStart($event, decoration)"
              (dragend)="onDecorationDragEnd()"
              class="flex cursor-grab flex-col items-center gap-2 rounded-lg border border-slate-700 bg-slate-800/70 px-3 py-2 text-xs text-slate-200 transition hover:border-indigo-400 hover:bg-slate-700/60 active:cursor-grabbing"
              [title]="'Drag ' + decoration.name + ' onto the canvas'"
            >
              <span
                class="flex h-20 w-full items-center justify-center overflow-hidden rounded border border-slate-700 bg-slate-950/60"
              >
                <canvas
                  #decoPreview
                  class="max-h-full max-w-full"
                  style="image-rendering: pixelated"
                ></canvas>
              </span>
              <span>{{ decoration.name }}</span>
            </button>
          }
        </div>
      </div>
    </div>
  </div>
</aside>
