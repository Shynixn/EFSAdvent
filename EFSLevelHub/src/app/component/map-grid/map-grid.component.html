<div
  [class]="'grid grid-flow-row gap-1 ' + (compact ? 'w-full' : 'inline-grid')"
  [style.gridTemplateColumns]="
    'repeat(' + width + ', ' + (compact ? 'minmax(0, 1fr)' : '3.5rem') + ')'
  "
>
  @for (y of rows; track y) {
    @for (x of cols; track x) {
      <button
        type="button"
        (click)="select(x, y)"
        [disabled]="isEmpty(x, y)"
        [title]="isEmpty(x, y) ? '' : 'Room ' + roomAt(x, y)"
        [class]="
          'flex flex-col items-center justify-center rounded border font-mono transition ' +
          cellClass +
          ' ' +
          (isEmpty(x, y)
            ? 'cursor-default border-slate-700 bg-slate-800/40 text-slate-600'
            : 'cursor-pointer border-slate-500 bg-slate-700 text-slate-100 hover:border-indigo-400 hover:bg-slate-600') +
          (isStart(x, y) ? ' ring-2 ring-emerald-400' : '') +
          (isSelected(x, y) ? ' ring-2 ring-indigo-400 bg-indigo-500/30' : '')
        "
      >
        @if (!isEmpty(x, y)) {
          <span>{{ roomAt(x, y) }}</span>
          @if (!compact) {
            <span class="text-[10px] text-slate-500">{{ x }},{{ y }}</span>
          }
        } @else {
          <span>—</span>
        }
      </button>
    }
  }
</div>
