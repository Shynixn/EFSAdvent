<!-- Left column (System): flush against the side nav (no spacing). -->
<aside
  class="flex h-full w-full flex-col overflow-y-auto border-r border-slate-800 bg-slate-900/60"
>
  <h2
    class="border-b border-slate-800 px-4 py-3 text-xs font-semibold uppercase tracking-wide text-slate-400"
  >
    System
  </h2>

  <div class="flex-1 space-y-4 px-4 py-4">
    <!-- Map grid (compact, scales to the column width) -->
    @if (stage) {
      <app-map-grid
        [stage]="stage"
        [selectedRoom]="selectedRoom"
        [compact]="true"
        (roomSelected)="roomSelected.emit($event)"
      />
      <p class="text-[10px] text-slate-500">Green ring = start room. Click to swap.</p>
    } @else {
      <p class="text-xs text-slate-500">Loading…</p>
    }

    <!-- Theme (drop-down style button that opens the picker modal) -->
    <button
      type="button"
      (click)="themeClicked.emit()"
      class="flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg border border-slate-700 bg-slate-800/70 px-3 py-2 text-left transition hover:border-indigo-400 hover:bg-slate-700/60"
      [title]="themeName"
      aria-haspopup="dialog"
    >
      <span class="flex min-w-0 flex-col">
        <span class="text-xs text-slate-400">Theme</span>
        <span class="truncate text-sm text-slate-100">{{ themeName }}</span>
      </span>
      <svg
        class="h-4 w-4 shrink-0 text-slate-400"
        viewBox="0 0 20 20"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          fill-rule="evenodd"
          d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  </div>
</aside>
