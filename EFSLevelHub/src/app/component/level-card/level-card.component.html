<article
  (click)="cardClick.emit()"
  class="group relative cursor-pointer overflow-hidden rounded-2xl border border-slate-700 bg-slate-800/60 shadow-lg transition hover:-translate-y-0.5 hover:border-slate-500 hover:shadow-xl"
>
  <!-- Preview header (stage preview or world map thumbnail) -->
  <div class="relative h-28 overflow-hidden bg-slate-900">
    @if (imageUrl) {
      <img
        [src]="imageUrl"
        alt=""
        loading="lazy"
        class="h-full w-full object-cover"
        style="image-rendering: pixelated"
      />
    } @else {
      <div
        class="flex h-full w-full items-center justify-center bg-gradient-to-br from-indigo-500/30 to-slate-900"
      >
        <svg class="h-10 w-10 text-slate-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          @if (kind === 'world') {
            <path
              d="M10 2a8 8 0 100 16 8 8 0 000-16zm5.5 6h-2.1a12 12 0 00-1-3.4A6.5 6.5 0 0115.5 8zM10 3.6c.6.9 1.2 2.4 1.5 4.4h-3c.3-2 .9-3.5 1.5-4.4zM3.5 12a6.6 6.6 0 010-4h2.3a14 14 0 000 4H3.5zM10 16.4c-.6-.9-1.2-2.4-1.5-4.4h3c-.3 2-.9 3.5-1.5 4.4zM12.4 10.4a12 12 0 000-.8c0-1.4.2-2.4.3-3.2h-2.2V8h3.4c0 .4.1.8.1 1.2zM6.6 8H9.5V4.2c-.9.3-1.9 1-2.9 2.1A6.6 6.6 0 006.6 8zm-1.1 1.4H3.8a6.5 6.5 0 001.9 3.3c-.6-.9-1.1-2-1.4-3.3z"
            />
          } @else {
            <path
              d="M3 4a1 1 0 011-1h12a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm2 1v10h10V5H5z"
            />
          }
        </svg>
      </div>
    }

    <!-- Kind badge + download affordance (the whole card downloads) -->
    <div class="absolute right-3 top-3 flex items-center gap-2">
      <span
        class="rounded-full px-2.5 py-0.5 text-xs font-semibold text-white"
        [class.bg-indigo-500/90]="kind === 'world'"
        [class.bg-emerald-600/90]="kind === 'stage'"
      >
        {{ kindLabel }}
      </span>
      <span
        class="flex h-7 w-7 items-center justify-center rounded-full bg-slate-900/70 text-slate-200 transition group-hover:bg-indigo-500/80 group-hover:text-white"
        [title]="'Download .' + (kind === 'world' ? 'fsaworld' : 'fsastage')"
        aria-hidden="true"
      >
        <svg
          class="h-4 w-4"
          [class.animate-pulse]="busy"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            d="M10 2a1 1 0 011 1v7.586l2.293-2.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 111.414-1.414L9 10.586V3a1 1 0 011-1z"
          />
          <path
            d="M3 15a1 1 0 011 1v1h12v-1a1 1 0 112 0v1a2 2 0 01-2 2H5a2 2 0 01-2-2v-1a1 1 0 011-1z"
          />
        </svg>
      </span>
    </div>

    @if (kind === 'world') {
      <span
        class="absolute bottom-2 left-3 rounded-full bg-slate-900/80 px-2.5 py-0.5 text-xs font-medium text-slate-100"
      >
        {{ stageCount }} {{ stageCount === 1 ? 'stage' : 'stages' }}
      </span>
    }
  </div>

  <!-- Body (same structure as app-card) -->
  <div class="p-4">
    <h3 class="truncate text-lg font-semibold text-white" [title]="title">{{ title }}</h3>
    <div class="mt-2 flex items-center gap-2">
      <span
        class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-slate-700 text-slate-300"
      >
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M10 2a4 4 0 100 8 4 4 0 000-8zM4 16.5A5.5 5.5 0 019.5 11h1a5.5 5.5 0 015.5 5.5.5.5 0 01-.5.5H4.5a.5.5 0 01-.5-.5z"
            clip-rule="evenodd"
          />
        </svg>
      </span>
      <span class="truncate text-sm text-slate-200">{{ author }}</span>
      @if (creationDate) {
        <span class="shrink-0 text-xs text-slate-400">({{ creationDate }})</span>
      }
    </div>
    <p class="mt-2 truncate font-mono text-[10px] leading-none text-slate-500">{{ uuid }}</p>
  </div>
</article>
