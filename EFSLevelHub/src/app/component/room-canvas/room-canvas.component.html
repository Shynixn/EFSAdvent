<div class="flex flex-col gap-3">
  <!-- Room canvas (editable; accepts dragged decorations) -->
  <div
    class="relative inline-block w-fit rounded-lg border border-slate-700 bg-slate-900/60 p-1"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
    (contextmenu)="onCanvasContextMenu($event)"
  >
    <canvas
      #canvas
      width="512"
      height="384"
      class="block touch-none"
      [class.cursor-crosshair]="tool !== 'hand'"
      [class.cursor-grab]="tool === 'hand' && hoveringObject() && !draggingObject()"
      [class.cursor-grabbing]="tool === 'hand' && draggingObject()"
      style="image-rendering: pixelated; width: 800px; height: 600px"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointerleave)="onPointerLeaveCanvas($event)"
      (contextmenu)="onContextMenu($event)"
    ></canvas>

    <!-- Transparent overlay: decoration drag preview + hovered-object outline. -->
    <canvas
      #preview
      width="512"
      height="384"
      class="pointer-events-none absolute left-1 top-1 block"
      style="image-rendering: pixelated; width: 800px; height: 600px"
    ></canvas>

    <!-- Backdrop that closes the context menu when clicking elsewhere. -->
    @if (contextMenu()) {
      <div
        class="fixed inset-0 z-10"
        (pointerdown)="closeContextMenu()"
        (contextmenu)="$event.preventDefault(); closeContextMenu()"
      ></div>

<!-- Smart-object context menu (decorations and enemies alike). -->
      <div
        class="absolute z-20 min-w-32 overflow-hidden rounded-lg border border-slate-700 bg-slate-800 py-1 text-sm shadow-lg"
        [style.left.px]="contextMenu()!.x"
        [style.top.px]="contextMenu()!.y"
      >
        @if (canRotateContextPlacement()) {
          <button
            type="button"
            (click)="rotateContextPlacement()"
            class="flex w-full cursor-pointer items-center gap-2 px-3 py-1.5 text-left text-slate-200 transition hover:bg-slate-700"
          >
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M4 2a1 1 0 011 1v1.6a7 7 0 119.2 10.4 1 1 0 11-1.2-1.6A5 5 0 106 6.7V8a1 1 0 11-2 0V3a1 1 0 011-1z"
                clip-rule="evenodd"
              />
            </svg>
            <span>Rotate</span>
          </button>
        }
        <button
          type="button"
          (click)="deleteContextPlacement()"
          class="flex w-full cursor-pointer items-center gap-2 px-3 py-1.5 text-left text-red-400 transition hover:bg-slate-700"
        >
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path
              d="M8 2a1 1 0 00-1 1v1H4a1 1 0 000 2h12a1 1 0 100-2h-3V3a1 1 0 00-1-1H8zM5 8a1 1 0 011 1v6a1 1 0 102 0V9a1 1 0 112 0v6a1 1 0 102 0V9a1 1 0 112 0v6a2 2 0 01-2 2H7a2 2 0 01-2-2V9a1 1 0 011-1z"
            />
          </svg>
          <span>Delete</span>
        </button>
      </div>
    }
  </div>
</div>
