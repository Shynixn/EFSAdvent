<div class="flex flex-col gap-3">
  <!-- Room canvas (editable) -->
  <div class="inline-block rounded-xl border border-slate-700 bg-slate-900/60 p-2">
    <canvas
      #canvas
      width="512"
      height="384"
      class="block cursor-crosshair touch-none"
      style="image-rendering: pixelated; width: 640px; height: 480px"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointerleave)="onPointerUp($event)"
      (contextmenu)="onContextMenu($event)"
    ></canvas>
  </div>

  <!-- Tile palette -->
  <div class="space-y-2">
    <div class="flex items-center gap-2">
      <h3 class="text-sm font-semibold uppercase tracking-wide text-slate-400">Tiles</h3>
      <span class="font-mono text-xs text-slate-500">selected: {{ tile }}</span>
    </div>
    <div
      class="inline-block max-h-96 overflow-auto rounded-xl border border-slate-700 bg-slate-900/60 p-2"
    >
      <canvas
        #tileset
        width="256"
        height="1024"
        class="block cursor-pointer touch-none"
        style="image-rendering: pixelated; width: 256px; height: 1024px"
        (click)="onTilesetClick($event)"
      ></canvas>
    </div>
  </div>
</div>
