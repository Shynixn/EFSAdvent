<div class="flex flex-col gap-3">
  <!-- Room canvas (editable; accepts dragged decorations) -->
  <div
    class="relative inline-block w-fit rounded-lg border border-slate-700 bg-slate-900/60 p-1"
    [class.ring-2]="dragNotAllowed()"
    [class.ring-red-500]="dragNotAllowed()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
    (contextmenu)="onCanvasContextMenu($event)"
  >
    <canvas
      #canvas
      [width]="canvasSize.width"
      [height]="canvasSize.height"
      class="block touch-none"
      [class.cursor-crosshair]="tool !== 'hand' && !dragNotAllowed()"
      [class.cursor-grab]="tool === 'hand' && hoveringObject() && !draggingObject()"
      [class.cursor-grabbing]="tool === 'hand' && draggingObject()"
      [class.cursor-not-allowed]="dragNotAllowed()"
      [class.cursor-crosshair]="connectingFrom() !== null"
      [style.image-rendering]="'pixelated'"
      [style.width.px]="canvasStyleSize.width"
      [style.height.px]="canvasStyleSize.height"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointerleave)="onPointerLeaveCanvas($event)"
      (contextmenu)="onContextMenu($event)"
    ></canvas>

    <!-- Transparent overlay: decoration drag preview + hovered-object outline. -->
    <canvas
      #preview
      [width]="canvasSize.width"
      [height]="canvasSize.height"
      class="pointer-events-none absolute left-1 top-1 block"
      [style.image-rendering]="'pixelated'"
      [style.width.px]="canvasStyleSize.width"
      [style.height.px]="canvasStyleSize.height"
    ></canvas>

    <!--
      Host-painted cross-layer overlay. The layer stack sizes this canvas to the
      whole stack and draws the connect drag on it, so a line can run from a door
      in this section to a door in another layer's section.
    -->
    <canvas #overlay class="pointer-events-none absolute left-0 top-0 z-10 block"></canvas>

    <!-- "Not allowed" indicator: this actor has no GBA sprite for this layer. -->
    @if (dragNotAllowed()) {
      <div
        class="pointer-events-none absolute inset-1 z-20 flex items-center justify-center bg-slate-950/50"
      >
        <svg
          class="h-24 w-24 text-red-500 drop-shadow"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 4l12 12M16 4L4 16" />
        </svg>
      </div>
    }

    <!-- Shared right-click menu (actions + submenus for object-specific choices) -->
    <app-canvas-context-menu
      [open]="!!contextMenu()"
      [x]="contextMenu()?.x ?? 0"
      [y]="contextMenu()?.y ?? 0"
      [actions]="contextActions()"
      [choiceGroups]="contextChoiceGroups()"
      (closed)="closeContextMenu()"
      (actionSelected)="onContextAction($event)"
      (choiceSelected)="onContextChoice($event)"
    />
  </div>
</div>
