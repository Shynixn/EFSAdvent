<div class="flex flex-col gap-3">
  <!-- Room canvas (editable; accepts dragged decorations) -->
  <div
    class="relative inline-block w-fit rounded-lg border border-slate-700 bg-slate-900/60 p-1"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
  >
    <canvas
      #canvas
      width="512"
      height="384"
      class="block touch-none"
      [class.cursor-crosshair]="tool !== 'hand'"
      [class.cursor-grab]="tool === 'hand' && hoveringObject() && !draggingObject()"
      [class.cursor-grabbing]="tool === 'hand' && draggingObject()"
      style="image-rendering: pixelated; width: 800px; height: 600px"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointerleave)="onPointerLeaveCanvas($event)"
      (contextmenu)="onContextMenu($event)"
    ></canvas>

    <!-- Transparent overlay: decoration drag preview + hovered-object outline. -->
    <canvas
      #preview
      width="512"
      height="384"
      class="pointer-events-none absolute left-1 top-1 block"
      style="image-rendering: pixelated; width: 800px; height: 600px"
    ></canvas>
  </div>
</div>
