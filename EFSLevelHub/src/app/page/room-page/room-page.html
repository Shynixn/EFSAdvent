<div class="flex h-full flex-col">
  <!-- Action bar -->
  <header
    class="flex items-center justify-between gap-4 border-b border-slate-800 bg-slate-900/80 px-6 py-3"
  >
    <div class="flex min-w-0 items-center gap-2">
      <app-button
        variant="ghost"
        color="slate"
        [iconOnly]="true"
        title="Close room"
        [icon]="'M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z'"
        (clicked)="close()"
      />
      <div class="min-w-0">
        <h1 class="truncate text-lg font-semibold text-white">{{ headerTitle() }}</h1>
        <p class="text-xs text-slate-400">
          Room editor
          <span class="text-slate-600">·</span>
          <span>Last saved: {{ lastSavedLabel() }}</span>
        </p>
      </div>
    </div>

    <div class="flex flex-shrink-0 items-center gap-2">
      <app-button
        variant="primary"
        color="indigo"
        [disabled]="!canSave()"
        [icon]="'M4 4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V7.414A2 2 0 0017.414 6L14 2.586A2 2 0 0012.586 2H4zm0 2h8v3a1 1 0 001 1h4v6H4V6zm2 7v-2h8v2H6z'"
        (clicked)="save()"
      >
        {{ saving() ? 'Saving…' : 'Save' }}
      </app-button>
      <app-button
        variant="primary"
        color="emerald"
        [disabled]="!canSaveAndExport()"
        [title]="
          canExport()
            ? 'Save, then rebuild a test ISO with this stage in the first stage slot (boss010)'
            : 'Re-import the disc image to enable export'
        "
        [icon]="'M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z'"
        (clicked)="saveAndExportTestIso()"
      >
        {{ exporting() ? 'Exporting…' : 'Export Test ISO' }}
      </app-button>
    </div>
  </header>

  <!-- Content: left System column · room canvas · right toolbox -->
  <div class="flex min-h-0 flex-1 items-stretch">
    <!-- Left column (System): wide rail, flush against the side nav (no spacing) -->
    <div class="w-[28rem] shrink-0">
      <app-system-column
        [stage]="stageData()"
        [selectedRoom]="roomIndex()"
        [themeName]="themeName()"
        [stageJson]="stageJson()"
        [gba]="gba()"
        [topLayer]="topLayer()"
        [paintTop]="paintTop()"
        (roomSelected)="selectRoom($event)"
        (themeClicked)="openTheme()"
        (gbaChange)="gba.set($event)"
        (topLayerChange)="topLayer.set($event)"
        (paintTopChange)="paintTop.set($event)"
        (clearRoomData)="clearRoomData()"
      />
    </div>

    <!-- Room canvas + layer controls (hugs the canvas; small black gaps to the sides) -->
    <div class="min-h-0 shrink-0 overflow-auto bg-slate-950 p-2">
      @if (loadError()) {
        <p class="rounded-lg bg-red-500/10 p-3 text-sm text-red-400">{{ loadError() }}</p>
      } @else if (room(); as roomData) {
        <div class="space-y-3">
          <!-- Layer controls -->
          <div class="flex flex-wrap items-center gap-4 text-sm">
            <!-- Tool selector: brush / eraser / hand -->
            <div
              class="flex items-center gap-1 rounded-lg border border-slate-700 bg-slate-800/70 p-1"
            >
              <button
                type="button"
                (click)="tool.set('brush')"
                title="Brush — draw tiles"
                class="flex h-8 w-8 cursor-pointer items-center justify-center rounded-md transition"
                [class.bg-indigo-500]="tool() === 'brush'"
                [class.text-white]="tool() === 'brush'"
                [class.text-slate-400]="tool() !== 'brush'"
                [class.hover:bg-slate-700]="tool() !== 'brush'"
              >
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <path
                    d="M13.5 2.5a2.12 2.12 0 013 3l-8.2 8.2-4 1 1-4 8.2-8.2zM4.3 15.2l-1 4 4-1-3-3z"
                  />
                </svg>
              </button>
              <button
                type="button"
                (click)="tool.set('eraser')"
                title="Eraser — clear tiles and ground (not decorations)"
                class="flex h-8 w-8 cursor-pointer items-center justify-center rounded-md transition"
                [class.bg-indigo-500]="tool() === 'eraser'"
                [class.text-white]="tool() === 'eraser'"
                [class.text-slate-400]="tool() !== 'eraser'"
                [class.hover:bg-slate-700]="tool() !== 'eraser'"
              >
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <path
                    d="M8.6 2.6a2 2 0 012.8 0l6 6a2 2 0 010 2.8l-5.4 5.4a2 2 0 01-2.8 0l-6-6a2 2 0 010-2.8l5.4-5.4zm1.4 1.4L4.6 9.4a.5.5 0 000 .7l1.6 1.6 5.4-5.4a.5.5 0 000-.7L9.9 4a.5.5 0 00-.7 0zM7.5 12.8l1.6 1.6a.5.5 0 00.7 0l3.3-3.3-2.3-2.3-3.3 3.3zM3 17h14a1 1 0 110 2H3a1 1 0 110-2z"
                  />
                </svg>
              </button>
              <button
                type="button"
                (click)="tool.set('hand')"
                title="Hand — move decorations"
                class="flex h-8 w-8 cursor-pointer items-center justify-center rounded-md transition"
                [class.bg-indigo-500]="tool() === 'hand'"
                [class.text-white]="tool() === 'hand'"
                [class.text-slate-400]="tool() !== 'hand'"
                [class.hover:bg-slate-700]="tool() !== 'hand'"
              >
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <path
                    d="M8 3.5a1 1 0 112 0V9h.5V2.5a1 1 0 112 0V9h.5V4a1 1 0 112 0v7.5a5.5 5.5 0 01-5.5 5.5H9.2a4.5 4.5 0 01-3.6-1.8l-2.1-2.8a1 1 0 011.5-1.3L6.5 12V5.5a1 1 0 112 0V9H8V3.5z"
                  />
                </svg>
              </button>
            </div>

            <span class="ml-auto font-mono text-xs text-slate-500">Room {{ roomIndex() }}</span>
          </div>

          <!-- Room canvas (stacked base layers, each collapsible) -->
          <app-room-layers
            [room]="roomData"
            [index]="roomIndex()"
            [renderer]="renderer()"
            [gba]="gba()"
            [topLayer]="topLayer()"
            [paintTop]="paintTop()"
            [tile]="brushTile()"
            [tool]="tool()"
            [smartObjects]="smartObjects()"
            [legacyActors]="legacyActors()"
            [groundLayers]="groundLayers()"
            [groundTile]="groundTile()"
            [groundMode]="groundMode()"
            (tileChanged)="onTileChanged($event)"
            (groundChanged)="onGroundChanged($event)"
            (decorationPlaced)="onDecorationPlaced($event)"
            (decorationMoved)="onDecorationMoved($event)"
            (decorationDeleted)="onDecorationDeleted($event)"
            (decorationRotated)="onDecorationRotated($event)"
            (placementUpdated)="onPlacementUpdated($event)"
          />
        </div>
      }
    </div>

    <!-- Toolbox (fills the remaining width to the right edge) -->
    <div class="min-w-80 max-w-md flex-1">
      <app-toolbox-column
        [renderer]="renderer()"
        [gba]="gba()"
        [themeIndex]="themeIndex()"
        [brushTile]="brushTile()"
        [selectedGroundId]="selectedGroundId()"
        [enemies]="enemies()"
        (tilePicked)="brushTile.set($event)"
        (groundPicked)="selectGround($event)"
        (groundCleared)="clearGround()"
        (decorationDragStarted)="onDecorationDragStarted()"
      />
    </div>
  </div>
</div>

<!-- Theme picker modal -->
<app-theme-picker
  [open]="themeOpen()"
  [currentIndex]="themeIndex()"
  (closed)="closeTheme()"
  (themeSelected)="selectTheme($event)"
/>

<!-- Semi-transparent loading overlay -->
<app-loading-overlay [open]="isLoading()" message="Loading..." />

<!-- Save progress (reuses the loading overlay) -->
<app-loading-overlay [open]="saving()" message="Saving..." />

<!-- Test ISO export progress (reuses the loading overlay) -->
<app-loading-overlay [open]="exporting()" message="Exporting test ISO..." />
