<div class="mx-auto max-w-6xl space-y-6 p-6 lg:p-8">
  <header class="space-y-1">
    <h1 class="text-3xl font-bold tracking-tight text-white">My Worlds</h1>
    <p class="text-slate-400">Worlds you have assembled from your stages.</p>
  </header>

  @if (worlds().length > 0) {
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3">
      @for (world of worlds(); track world.id) {
        <app-card
          [title]="world.name"
          [author]="world.author"
          [uuid]="world.id"
          [imageUrl]="worldmapUrl()"
          [badge]="isDefault(world) ? 'Cannot be changed' : null"
          [variant]="isDefault(world) ? 'danger' : 'default'"
          (cardClick)="openWorld(world)"
        />
      }
    </div>
  } @else {
    <p
      class="rounded-xl border border-dashed border-slate-700 bg-slate-800/40 p-8 text-center text-slate-400"
    >
      No worlds yet. Import your game files in Settings to create the default world.
    </p>
  }
</div>
