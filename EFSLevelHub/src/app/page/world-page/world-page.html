<div class="flex h-full flex-col">
  <!-- Action bar -->
  <header
    class="flex items-center justify-between gap-4 border-b border-slate-800 bg-slate-900/80 px-6 py-3"
  >
    <div class="min-w-0">
      <h1 class="truncate text-lg font-semibold text-white">{{ worldName() }}</h1>
      <p class="text-xs text-slate-400">World</p>
    </div>
    <app-button
      variant="outline"
      color="slate"
      [icon]="'M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z'"
      (clicked)="close()"
    >
      Close
    </app-button>
  </header>

  <!-- World map (fills the available area) -->
  <div
    #mapArea
    class="relative flex flex-1 items-center justify-center overflow-hidden bg-slate-950"
  >
    @if (worldmapUrl()) {
      <img
        [src]="worldmapUrl()"
        alt="World map"
        (load)="onImageLoad($event)"
        class="h-full w-full object-contain shadow-2xl"
        style="image-rendering: pixelated"
      />

      <!-- Overlay sized/positioned to the image's displayed (contain-fitted)
           box, so markers stay anchored to the map at any size. -->
      @if (mapBox(); as box) {
        <div class="pointer-events-none absolute inset-0 flex items-center justify-center">
          <div class="relative" [style.width.px]="box.width" [style.height.px]="box.height">
            @for (point of points(); track point.id) {
              <!-- Single clickable element anchored at the point: the dot stays
                   centered on the coordinate while the label sits beside it. -->
              <button
                type="button"
                (click)="onPointClick(point)"
                [attr.title]="point.label || point.id"
                [attr.aria-label]="point.label || point.id"
                class="pointer-events-auto absolute flex -translate-y-1/2 cursor-pointer items-center gap-1.5 rounded focus:outline-none focus:ring-2 focus:ring-indigo-300"
                [style.left.%]="point.x"
                [style.top.%]="point.y"
              >
                <span
                  class="h-3 w-3 shrink-0 -translate-x-1/2 rounded-full border-2 border-white bg-indigo-500 shadow-md transition group-hover:scale-125"
                ></span>
                @if (point.label) {
                  <span
                    class="whitespace-nowrap rounded bg-slate-900/70 px-1.5 py-0.5 text-xs font-medium text-white transition hover:bg-slate-900/90"
                  >
                    {{ point.label }}
                  </span>
                }
              </button>
            }
          </div>
        </div>
      }
    } @else {
      <p class="text-slate-500">World map image not available yet.</p>
    }
  </div>
</div>

<!-- Stage picker: re-points the clicked marker at a different stage. -->
<app-stage-picker
  [open]="pickerOpen()"
  [stages]="allStages()"
  [selectedId]="activePoint()?.stageId ?? ''"
  [title]="activePoint()?.label ? 'Re-point ' + activePoint()!.label : 'Select a stage'"
  (picked)="onStagePicked($event)"
  (closed)="closePicker()"
/>
