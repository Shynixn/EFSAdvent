<label class="flex items-center gap-2">
  <span class="text-xs font-medium uppercase tracking-wide text-slate-400">{{ label }}</span>
  <select
    [ngModel]="selectedId"
    (ngModelChange)="onSelectionChange($event)"
    class="cursor-pointer rounded-xl border border-slate-700 bg-slate-800/70 px-3 py-2 text-sm text-slate-100 outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/30"
  >
    @for (option of options; track option.id) {
      <option [value]="option.id">{{ option.label }}</option>
    }
  </select>
</label>
